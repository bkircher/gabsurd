name = "gabsurd"
version = "0.2.0"

description = "A Gleam SDK for the Absurd durable workflow system, with type-safe database access via Squirrel and OTP worker actors"
licences = ["Apache-2.0"]
repository = { type = "github", user = "kasuboski", repo = "gabsurd" }
links = [
  { title = "Absurd", href = "https://github.com/absurd-sql/absurd" },
  { title = "Squirrel", href = "https://github.com/giacomocavalieri/squirrel" },
]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
pog = ">= 4.1.0 and < 5.0.0"
gleam_time = ">= 1.8.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
envoy = ">= 1.2.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
youid = ">= 1.6.1 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
glinter = ">= 2.19.2 and < 3.0.0"
squirrel = "== 4.7.0"

[tools.glinter]
# Squirrel owns this generated module. Lint only the handwritten code.
exclude = ["src/gabsurd/internal/sql.gleam"]

[tools.glinter.ignore]
# Gleeunit discovers exported test functions, and assertions are the test
# failure mechanism rather than library error handling.
"test/**/*.gleam" = [
  "assert_ok_pattern",
  "discarded_result",
  "unused_exports",
]
